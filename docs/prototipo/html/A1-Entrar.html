<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar</title>
<meta name="viewport" content="width=390">
<!-- Protótipo Boragora: tela Entrar. Mockup estático de referência visual; não é código do app. -->
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;src:url('../assets/fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;src:url('../assets/fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;src:url('../assets/fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;src:url('../assets/fonts/barlow-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Saira';font-style:normal;font-weight:700;src:url('../assets/fonts/saira-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Saira';font-style:italic;font-weight:700;src:url('../assets/fonts/saira-latin-700-italic.woff2') format('woff2')}
@font-face{font-family:'Saira';font-style:italic;font-weight:800;src:url('../assets/fonts/saira-latin-800-italic.woff2') format('woff2')}
x-dc,helmet{display:contents}

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #111111; color: #FFFFFF; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; line-height: 1.35; overflow: hidden">
<main style="flex: 1; padding: 124px 24px 0; display: flex; flex-direction: column; gap: 44px">
<img src="../assets/logo-boragora.svg" alt="Boragora Viagens" style="width: 300px; height: auto; display: block; align-self: center">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="entrar-email" style="font-size: 14px; font-weight: 600; color: #C4C0B4">E-mail</label>
<input id="entrar-email" type="email" placeholder="voce@email.com" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1.5px solid #34322B; background: #1B1A17; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="entrar-senha" style="font-size: 14px; font-weight: 600; color: #C4C0B4">Senha</label>
<input id="entrar-senha" type="password" placeholder="Sua senha" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1.5px solid #34322B; background: #1B1A17; font-size: 16px; outline: none">
</div>
<a href="Tela-inicial-aluno.html" style="margin-top: 6px; min-height: 54px; border-radius: 14px; background: #FFC800; color: #111111; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Entrar</a>
</div>
</main>
<footer style="padding: 0 24px 44px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 15px; color: #C4C0B4">É aluno e ainda não tem conta?</div>
<a href="A2-Criar-conta.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 16px; font-weight: 700; color: #FFC800">Criar conta</a>
</footer>
</div>
</x-dc>
</body>
</html>
