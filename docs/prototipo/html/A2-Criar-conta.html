<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar conta</title>
<meta name="viewport" content="width=390">
<!-- Protótipo Boragora: tela Criar conta (aluno). Mockup estático de referência visual; não é código do app. -->
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;src:url('../assets/fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;src:url('../assets/fonts/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;src:url('../assets/fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;src:url('../assets/fonts/barlow-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Saira';font-style:normal;font-weight:700;src:url('../assets/fonts/saira-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Saira';font-style:italic;font-weight:700;src:url('../assets/fonts/saira-latin-700-italic.woff2') format('woff2')}
@font-face{font-family:'Saira';font-style:italic;font-weight:800;src:url('../assets/fonts/saira-latin-800-italic.woff2') format('woff2')}
x-dc,helmet{display:contents}
html,body{background:#000}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #111111; color: #FFFFFF; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; line-height: 1.35; overflow: hidden">
<header style="padding: 56px 12px 0; display: flex; align-items: center; gap: 4px">
<a href="A1-Entrar.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-weight: 800; font-size: 26px; line-height: 1.1">Criar conta</h1>
</header>
<main style="flex: 1; padding: 12px 24px 0; display: flex; flex-direction: column; gap: 28px">
<p style="margin: 0; font-size: 16px; color: #C4C0B4">Conta de aluno. Depois do cadastro, o motorista vincula você à sua van.</p>
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="conta-nome" style="font-size: 14px; font-weight: 600; color: #C4C0B4">Nome completo</label>
<input id="conta-nome" type="text" placeholder="Como o motorista conhece você" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1.5px solid #34322B; background: #1B1A17; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="conta-email" style="font-size: 14px; font-weight: 600; color: #C4C0B4">E-mail</label>
<input id="conta-email" type="email" placeholder="voce@email.com" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1.5px solid #34322B; background: #1B1A17; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="conta-senha" style="font-size: 14px; font-weight: 600; color: #C4C0B4">Senha</label>
<input id="conta-senha" type="password" placeholder="Crie uma senha" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1.5px solid #34322B; background: #1B1A17; font-size: 16px; outline: none">
</div>
<a href="A3-Sem-turma.html" style="margin-top: 6px; min-height: 54px; border-radius: 14px; background: #FFC800; color: #111111; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Criar conta</a>
</div>
</main>
<footer style="padding: 0 24px 44px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 15px; color: #C4C0B4">Já tem conta?</div>
<a href="A1-Entrar.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 16px; font-weight: 700; color: #FFC800">Entrar</a>
</footer>
</div>
</x-dc>
</body>
</html>
